# A cada push na main: gera a dist/ (que é o que a TV roda), faz commit dela se mudou
# e limpa o cache do jsDelivr, para o TizenBrew pegar a versão nova na próxima vez que abrir.
name: Build e publicar na TV

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Build
        env:
          # Chaves opcionais embutidas no app (Settings → Secrets and variables → Actions).
          KAI_TMDB: ${{ secrets.TMDB_API_KEY }}
          KAI_MDBLIST: ${{ secrets.MDBLIST_API_KEY }}
          # Link iCal da agenda (Google Agenda › Endereço secreto no formato iCal). Vai no build público.
          KAI_CALENDAR: ${{ secrets.CALENDAR_ICAL_URL }}
        run: |
          export KAI_COMMIT="$GITHUB_SHA"
          export KAI_BUILD_DATE="$(git log -1 --format=%cI)"
          MSG="$(git log -1 --format=%s)"
          # Merge de PR: usa o título do PR (primeira linha do corpo) em vez de "Merge pull request #N".
          case "$MSG" in "Merge pull request"*) B="$(git log -1 --format=%b | head -1)"; [ -n "$B" ] && MSG="$B";; esac
          export KAI_COMMIT_MSG="$MSG"
          npm run build

      - name: Preparar motor para teste em Node 12
        run: node tools/build-engine-test.mjs "$RUNNER_TEMP/sera-engine.cjs"

      - uses: actions/setup-node@v4
        with:
          node-version: 12.4.0

      - name: Verificar serviço e torrent em Node 12.4.0
        env:
          SERA_ENGINE_BUNDLE: ${{ runner.temp }}/sera-engine.cjs
        run: |
          node tests/node12-service-smoke.cjs
          node tests/torrent-engine-node12.cjs

      - name: Commit da dist/ se mudou
        run: |
          git add -A dist remote/tv-service.js
          # Push feito com o GITHUB_TOKEN não dispara a Action de novo, então não entra em loop.
          if git diff --cached --quiet; then
            echo "dist/ já está em dia."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Build da dist/ para a TV"
            git push
          fi

      - name: Limpar cache do jsDelivr
        run: |
          for f in package.json dist/index.html dist/app.js dist/app.css dist/build.json dist/hls.js remote/tv-service.js; do
            for ref in "" "@main"; do
              curl -fsS -o /dev/null "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}${ref}/$f" || echo "Falhou: $ref $f"
            done
          done
